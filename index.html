<!DOCTYPE html>
<html>
<head>
  <base href="/MedyaAtlas/">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="MedyaAtlas — GPS medya haritası (iPhone / tarayıcı).">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="MedyaAtlas">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <title>MedyaAtlas</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#071018">
  <style>
    html, body { margin: 0; height: 100%; background: #071018; color: #c8d0d8;
      font-family: -apple-system, system-ui, sans-serif; }
    .boot { display: flex; align-items: center; justify-content: center;
      height: 100%; }
  </style>
</head>
<body>
  <div class="boot" id="boot">MedyaAtlas…</div>
  <script>
    (async function () {
      try {
        if ('serviceWorker' in navigator) {
          var regs = await navigator.serviceWorker.getRegistrations();
          await Promise.all(regs.map(function (r) { return r.unregister(); }));
        }
        if (window.caches && caches.keys) {
          var keys = await caches.keys();
          await Promise.all(keys.map(function (k) { return caches.delete(k); }));
        }
      } catch (e) {}
      var s = document.createElement('script');
      s.src = 'flutter_bootstrap.js';
      s.async = true;
      s.onload = function () {
        var b = document.getElementById('boot');
        if (b) b.remove();
      };
      document.body.appendChild(s);
    })();
  </script>
</body>
</html>
