  <title>MedyaAtlas</title>

  <meta name="theme-color" content="#071018">
</head>
<body>
  <script>
    // Eski Flutter SW / Cache Storage — iPhone Ana Ekran kısayolunda takılı kalmasın.
    window.__medyaAtlasReady = (async function () {
      try {
        if ('serviceWorker' in navigator) {
          var regs = await navigator.serviceWorker.getRegistrations();
          await Promise.all(regs.map(function (r) { return r.unregister(); }));
        }
        if (window.caches && caches.keys) {
          var keys = await caches.keys();
          await Promise.all(keys.map(function (k) { return caches.delete(k); }));
        }
      } catch (e) {}
    })();
  </script>
  <script>
    (async function () {
      if (window.__medyaAtlasReady) await window.__medyaAtlasReady;
      var s = document.createElement('script');
      s.src = 'flutter_bootstrap.js?v=1.0.28';
      s.async = true;
      document.body.appendChild(s);
    })();
  </script>
</body>
