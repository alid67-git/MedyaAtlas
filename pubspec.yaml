  http: ^1.2.2
  desktop_drop: ^0.7.0
  video_player: ^2.10.0
  video_player_win: ^3.2.0
  permission_handler: ^12.0.1
  google_sign_in: ^7.2.0
  googleapis: ^16.0.0
  googleapis_auth: ^2.0.0
  photo_manager: ^3.7.1
  path_provider: ^2.1.5
  open_filex: ^4.7.0
