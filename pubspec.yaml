name: medyaatlas
description: MedyaAtlas — Windows, Android ve web GPS medya haritası (yerel kayıt).
publish_to: 'none'
version: 1.0.50+78

environment:
  sdk: '>=3.9.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_map: ^8.3.1
  latlong2: ^0.10.1
  provider: ^6.1.5+1
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  uuid: ^4.6.0
  image_picker: ^1.1.2
  exif: ^3.3.0
  file_picker: ^8.3.7
