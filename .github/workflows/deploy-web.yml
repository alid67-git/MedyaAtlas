name: Deploy Web (GitHub Pages)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

# gh-pages dalına yayın + site kapalıysa GITHUB_TOKEN ile yeniden aç.
# (Resmi deploy-pages, yalnızca main/gh-pages ortam politikası ve kapalı
#  Pages yüzünden etiket push'larında 404 / Setup Pages hatası veriyordu.)
permissions:
  contents: write
  pages: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter build web --release --base-href /MedyaAtlas/ --pwa-strategy=none

      - name: Verify version.json
        run: cat build/web/version.json

      - name: Ensure GitHub Pages enabled (gh-pages / root)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          echo "Current Pages status (may be 404 if disabled):"
          gh api "repos/${{ github.repository }}/pages" || true

          # Repo private iken Pages kapanmış olabilir; yeniden oluştur.
          gh api --method POST "repos/${{ github.repository }}/pages" \
            --input - <<'EOF'
          {"build_type":"legacy","source":{"branch":"gh-pages","path":"/"}}
          EOF

          # Kaynağı her zaman gh-pages/(root) yap.
          gh api --method PUT "repos/${{ github.repository }}/pages" \
            --input - <<'EOF'
          {"build_type":"legacy","source":{"branch":"gh-pages","path":"/"}}
          EOF

          echo "Pages status after enable attempt:"
          gh api "repos/${{ github.repository }}/pages" || true
          # Enable başarısız olsa bile gh-pages güncellenir; kullanıcı Settings'ten açabilir.
          exit 0

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build/web
          publish_branch: gh-pages
          force_orphan: true
          commit_message: 'deploy web ${{ github.ref_name }}'
