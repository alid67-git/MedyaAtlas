name: Deploy Web (GitHub Pages)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

# gh-pages dalına yayın + site kapalıysa GITHUB_TOKEN ile yeniden aç.
# (Resmi deploy-pages, yalnızca main/gh-pages ortam politikası ve kapalı
#  Pages yüzünden etiket push'larında 404 / Setup Pages hatası veriyordu.)
permissions:
  contents: write
  pages: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter build web --release --base-href /MedyaAtlas/ --pwa-strategy=none

      - name: Verify version.json
        run: cat build/web/version.json

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build/web
          publish_branch: gh-pages
          force_orphan: true
          commit_message: 'deploy web ${{ github.ref_name }}'

      # Creating/enabling a Pages site needs repo admin — GITHUB_TOKEN gets 403.
      # If this fails, the owner must flip Settings → Pages once; gh-pages is already updated.
      - name: Verify GitHub Pages is enabled
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          gh api --method POST "repos/${{ github.repository }}/pages" \
            --input - <<'EOF'
          {"build_type":"legacy","source":{"branch":"gh-pages","path":"/"}}
          EOF
          gh api --method PUT "repos/${{ github.repository }}/pages" \
            --input - <<'EOF'
          {"build_type":"legacy","source":{"branch":"gh-pages","path":"/"}}
          EOF
          if gh api "repos/${{ github.repository }}/pages"; then
            echo "Pages site is enabled."
            exit 0
          fi
          echo "::error::GitHub Pages is DISABLED (has_pages=false). CI cannot enable it (403 admin). Owner must: Settings → Pages → Build and deployment → Source = Deploy from a branch → Branch = gh-pages / (root) → Save. Web files are already on gh-pages (${{ github.ref_name }})."
          exit 1
