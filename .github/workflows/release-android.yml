name: Release Android APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Sürüm etiketi (örn. v1.0.35). Boşsa pubspec version kullanılır. İndirme her zaman android-latest.'
        required: false
        type: string

permissions:
  contents: write

jobs:
  android-apk:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      version: ${{ steps.meta.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Accept Android licenses
        run: yes | flutter doctor --android-licenses || true

      - name: Pub get
        run: flutter pub get

      - name: Build release APK
        env:
          GOOGLE_SERVER_CLIENT_ID: ${{ secrets.GOOGLE_SERVER_CLIENT_ID }}
        run: |
          if [ -n "$GOOGLE_SERVER_CLIENT_ID" ]; then
            flutter build apk --release \
              --dart-define=GOOGLE_SERVER_CLIENT_ID="$GOOGLE_SERVER_CLIENT_ID"
          else
            echo "UYARI: GOOGLE_SERVER_CLIENT_ID secret yok; Drive Sign-In için SHA-1 + OAuth gerekir."
            flutter build apk --release
          fi

      - name: Resolve version and copy APK
        id: meta
        run: |
          set -e
          PUBSPEC_VER=$(grep '^version:' pubspec.yaml | head -1 | sed 's/version:[[:space:]]*//;s/+.*//')
          if [ "${{ github.ref_type }}" = "tag" ]; then
            TAG="${{ github.ref_name }}"
          elif [ -n "${{ inputs.version }}" ]; then
            TAG="${{ inputs.version }}"
          else
            TAG="v${PUBSPEC_VER}"
          fi
          case "$TAG" in
            v*) ;;
            *) TAG="v$TAG" ;;
          esac
          VERSION="${TAG#v}"
          NAME="MedyaAtlas.apk"
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk "dist/$NAME"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "apk_name=$NAME" >> "$GITHUB_OUTPUT"
          ls -lh "dist/$NAME"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: MedyaAtlas-apk
          path: dist/MedyaAtlas.apk

      # Sabit indirme linki — sürüm klasörü/adı yok (RideAtlas android-latest gibi).
      - name: Publish rolling android-latest
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: MedyaAtlas Android (latest) - ${{ steps.meta.outputs.version }}
          files: dist/MedyaAtlas.apk
          make_latest: false
          body: |
            Sabit indirme (her build aynı URL/isim):

            https://github.com/alid67-git/MedyaAtlas/releases/download/android-latest/MedyaAtlas.apk

            Sürüm: ${{ steps.meta.outputs.version }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create versioned GitHub Release
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: MedyaAtlas ${{ steps.meta.outputs.tag }}
          generate_release_notes: false
          files: dist/MedyaAtlas.apk
          body: |
            ## İndirme (sabit isim — sürüm yok)

            - Android: https://github.com/alid67-git/MedyaAtlas/releases/download/android-latest/MedyaAtlas.apk
            - Windows: https://github.com/alid67-git/MedyaAtlas/releases/download/windows-latest/MedyaAtlas-windows.zip
            - Web: https://alid67-git.github.io/MedyaAtlas/

            **Not:** 0.7.8’den itibaren APK imzası sabittir. Daha eski sürüm kuruluysa
            bir kez kaldırıp yeniden kurun; sonraki güncellemeler silmeden olur.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  windows-zip:
    runs-on: windows-latest
    needs: android-apk
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop

      - name: Pub get
        run: flutter pub get

      - name: Build Windows release
        run: flutter build windows --release

      - name: Zip release folder
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          $src = "build\windows\x64\runner\Release"
          if (-not (Test-Path $src)) { throw "Windows Release klasörü yok: $src" }
          Compress-Archive -Path "$src\*" -DestinationPath "dist\MedyaAtlas-windows.zip" -Force
          Get-Item "dist\MedyaAtlas-windows.zip" | Format-List Name, Length

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: MedyaAtlas-windows
          path: dist/MedyaAtlas-windows.zip

      - name: Publish rolling windows-latest
        uses: softprops/action-gh-release@v2
        with:
          tag_name: windows-latest
          name: MedyaAtlas Windows (latest) - ${{ needs.android-apk.outputs.version }}
          files: dist/MedyaAtlas-windows.zip
          make_latest: false
          body: |
            Sabit indirme:

            https://github.com/alid67-git/MedyaAtlas/releases/download/windows-latest/MedyaAtlas-windows.zip

            Sürüm: ${{ needs.android-apk.outputs.version }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Attach zip to versioned release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.android-apk.outputs.tag }}
          files: dist/MedyaAtlas-windows.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
