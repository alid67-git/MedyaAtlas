name: Release Android APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release etiketi (örn. v0.6.6). Boşsa pubspec version kullanılır.'
        required: false
        type: string

permissions:
  contents: write

jobs:
  android-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Accept Android licenses
        run: yes | flutter doctor --android-licenses || true

      - name: Pub get
        run: flutter pub get

      - name: Build release APK
        env:
          GOOGLE_SERVER_CLIENT_ID: ${{ secrets.GOOGLE_SERVER_CLIENT_ID }}
        run: |
          if [ -n "$GOOGLE_SERVER_CLIENT_ID" ]; then
            flutter build apk --release \
              --dart-define=GOOGLE_SERVER_CLIENT_ID="$GOOGLE_SERVER_CLIENT_ID"
          else
            echo "UYARI: GOOGLE_SERVER_CLIENT_ID secret yok; Drive Sign-In için SHA-1 + OAuth gerekir."
            flutter build apk --release
          fi

      - name: Resolve tag and copy APK
        id: meta
        run: |
          set -e
          PUBSPEC_VER=$(grep '^version:' pubspec.yaml | head -1 | sed 's/version:[[:space:]]*//;s/+.*//')
          if [ "${{ github.ref_type }}" = "tag" ]; then
            TAG="${{ github.ref_name }}"
          elif [ -n "${{ inputs.version }}" ]; then
            TAG="${{ inputs.version }}"
          else
            TAG="v${PUBSPEC_VER}"
          fi
          case "$TAG" in
            v*) ;;
            *) TAG="v$TAG" ;;
          esac
          NAME="MedyaAtlas.apk"
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk "dist/$NAME"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "apk_name=$NAME" >> "$GITHUB_OUTPUT"
          echo "pubspec=$PUBSPEC_VER" >> "$GITHUB_OUTPUT"
          ls -lh "dist/$NAME"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: MedyaAtlas-apk
          path: dist/MedyaAtlas.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: MedyaAtlas ${{ steps.meta.outputs.tag }}
          generate_release_notes: true
          files: dist/MedyaAtlas.apk
          body: |
            ## Android APK
            Sabit indirme linki (sürüm dosya adında yok):
            https://github.com/alid67-git/MedyaAtlas/releases/latest/download/MedyaAtlas.apk

            Uygulama açılışta güncellemeyi kontrol eder.

            ### Not
            - Sideload APK (Play Store imzası değil)
            - Kaynak: https://github.com/alid67-git/MedyaAtlas
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
